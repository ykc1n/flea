services:
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["flea-data:/app/data"]
    restart: unless-stopped
  worker:
    build: .
    command: ["python3", "-m", "flea.worker"]
    volumes: ["flea-data:/app/data"]
    # For full analysis mount a dedicated Zero-K installation and configure the
    # engine environment as described in README. Metadata discovery works alone.
    restart: unless-stopped
volumes:
  flea-data:
